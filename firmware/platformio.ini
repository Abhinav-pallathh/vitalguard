; VitalGuard recorder firmware — ESP32 DevKit v1
; Pinned so the build is reproducible and works fully OFFLINE once packages are cached.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 230400
upload_speed = 921600
; Arduino's loopTask defaults to core 1 on this framework -- same core
; sampler_task is pinned to at max priority with a non-yielding busy-spin
; (main.cpp, the `while ((int32_t)(micros() - next) < 0)` spin in
; sampler_task). Without this, loopTask never gets scheduled again once
; the sampler starts: setup() finishes (one paint() call, hence a frozen
; "IDLE" on the OLED) but loop() never runs, so zero rows are ever emitted.
; Forces the Arduino task onto core 0, matching the comments' own stated
; intent ("core 1 -- the sampler", "core 0 -- the writer").
build_flags = -DARDUINO_RUNNING_CORE=0
; No Adafruit MPU6050 / Unified Sensor here: the real bench board's "MPU6050"
; is a mislabeled MPU6500 (WHO_AM_I=0x70), which that library hard-rejects.
; main.cpp talks to the register map directly instead (see the mpu_read
; comment there) -- one less dependency, and it works on either chip.
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
